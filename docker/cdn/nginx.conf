# Local CDN edge: a pull-through caching proxy in front of the origin.
# In production, point CDN_URL at CloudFront / Cloudflare / Bunny with the
# same origin (http://<api-host>/storage/) instead of this container.

proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=media:50m
                 max_size=2g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name _;

    location /storage/ {
        limit_except GET HEAD { deny all; }

        resolver 127.0.0.11 valid=10s;
        set $origin http://web;
        proxy_pass $origin;
        proxy_set_header Host $host;

        proxy_cache media;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin * always;
    }

    location / {
        return 404;
    }
}
